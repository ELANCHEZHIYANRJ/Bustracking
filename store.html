<!DOCTYPE html>
<html>
<head>
    <title>Display Local JSON</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        .user-card { border: 1px solid #ccc; padding: 10px; margin: 5px 0; border-radius: 4px; }
    </style>
</head>
<body>

    <h1>User Data from Local JSON</h1>
    <div id="data-container">Loading data...</div>

    <script>
        async function displayLocalData() {
            try {
                // Fetch the local file
                const response = await fetch('data.json');
                
                if (!response.ok) {
                    throw new Error("Could not reach the JSON file.");
                }

                // Convert response to JavaScript object
                const data = await response.json();
                
                // Select the container
                const container = document.getElementById('data-container');
                container.innerHTML = ''; // Clear "Loading..." text

                // Loop through data and create HTML elements
                data.forEach(user => {
                    const div = document.createElement('div');
                    div.className = 'user-card';
                    div.innerHTML = `<strong>Name:</strong> ${user.name} <br> 
                                     <strong>City:</strong> ${user.city}`;
                    container.appendChild(div);
                });

            } catch (error) {
                document.getElementById('data-container').innerHTML = 
                    "Error: " + error.message + ". Make sure you are using a local server.";
                console.error("Error fetching JSON:", error);
            }
        }

        // Run the function
        displayLocalData();
    </script>
</body>
</html>
